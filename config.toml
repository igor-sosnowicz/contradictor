data_directory = "./data"

# --- LMM Mapping & Config ---
llm_backend = "openai_compat"
extractor_model = "google/gemma-4-12b"
judge_model = "google/gemma-4-12b"
pipeline_chunk_size = 2000
pipeline_chunk_overlap = 200
pipeline_top_k_links = 5

[llm]
timeout = 180.0
max_tokens = 4096

# reasoning_effort = "none" gives:
# ~5x speedup with no loss on schema-filling tasks.
# Raise a role to "low" or higher if its output degrades.
[llm.extractor]
temperature = 0.1
seed = 0
reasoning_effort = "none"

[llm.judge]
temperature = 0.0
seed = 0
reasoning_effort = "none"

[llm.generator]
temperature = 0.8
reasoning_effort = "none"

[llm.styler]
temperature = 0.7
reasoning_effort = "none"