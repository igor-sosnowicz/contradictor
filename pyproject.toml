[project]
name = "contradictor"
version = "0.1.0"
description = "Contradictors is an NLP counterargument finding system."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.4.2",
    "ddgs>=9.14.4",
    "diskcache>=5.6.3",
    "gitpython>=3.1.50",
    "httpx>=0.28.1",
    "keybert>=0.9.0",
    "loguru>=0.7.3",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "py7zr>=1.1.3",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "spacy>=3.8.14",
    "tiktoken>=0.13.0",
    "tqdm>=4.68.3",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    "pre-commit>=4.6.0",
    "pylint>=4.0.6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[project.scripts]
app = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = ["."]
python_version = "3.13"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pylint."messages control"]
disable = [
    "invalid-name", # Variable name "X"  is a valid name in data science.
]


[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
docstring-code-format = true
skip-magic-trailing-comma = false


[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "ANN002",  # Allow for untyped *args.
    "ANN003",  # Allow for untyped **kwargs.
    "COM812",  # Ignore missing trailing comma, `ruff` formatter already enforces that.
    "D203",    # Incorrect blank line before class.
    "D205",    # Do not require blank line after docstring, it conflicts with the formatter.
    "D212",    # Let multi-line docstring start at the second line.
    "D413",    # Blank line is not required after the "Returns" section.
    "EM101",   # Allow for string literals in exception constructors.
    "EM102",   # Allow for f-strings in exception constructors.
    "PLC0415", # Let local imports be used, e.g. for lazy loading.
    "TRY003",  # Also, allow for raising exceptions with long literal messages.
    "N806",    # Allow variables beginning with uppercase, e.g. X - features vector.
]

[tool.ruff.lint.per-file-ignores]

# Disable certain rules for tests.
"tests/**/*.py" = [
    "S101",   # Allow for asserts allowed in tests.
    "ARG",    # Ignore unused function arguments, because fixtures are not ordinary arguments.
    "SLF001", # Private members may be accessed in tests.
]

[tool.typos.default.extend-words]
TPESampler = "TPESampler"
tpe = "tpe"
