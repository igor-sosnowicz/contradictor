<!--Disclaimer: The below website for annotating is a helper tool, so, has been completely vibe-coded.-->
<!doctype html>
<html lang="en">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Argument Annotator</title>
    <style>
        body {
            font:
                16px system-ui,
                sans-serif;
            max-width: 950px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #222;
        }
        textarea {
            box-sizing: border-box;
            width: 100%;
            min-height: 220px;
            padding: 0.75rem;
            font: inherit;
        }
        input,
        select,
        button {
            font: inherit;
            padding: 0.5rem;
            margin: 0.25rem 0;
        }
        button {
            cursor: pointer;
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1rem;
            margin: 0.75rem 0;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }
        .row select {
            flex: 1;
            min-width: 180px;
        }
        .quote {
            white-space: pre-wrap;
            margin: 0.4rem 0;
        }
        .label {
            color: #555;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .muted {
            color: #555;
        }
        .source-url {
            color: #0066cc;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            word-break: break-all;
        }
    </style>

    <h1>Argument Annotator</h1>

    <section class="card">
        <h2>Load Documents</h2>
        <div class="row">
            <input
                type="file"
                id="directoryInput"
                webkitdirectory
                directory
                multiple
                accept=".txt"
                aria-label="Select directory with .txt files"
            />
            <button id="loadDirectory">Load .txt files</button>
        </div>
        <p class="muted">
            Select a folder containing .txt files to load them all at once.
        </p>
    </section>

    <section class="card">
        <h2>Source document</h2>
        <div class="row">
            <select id="documentPicker" aria-label="Choose document"></select>
            <button id="addDocument">Add document</button>
        </div>
        <textarea
            id="documentText"
            placeholder="Paste or type the source document here"
        ></textarea>
        <div class="source-url" id="sourceUrl"></div>
        <p class="muted">
            Select a passage in the text, then mark it as a claim or evidence.
        </p>
        <button id="markClaim">Mark selection as claim</button>
        <button id="markEvidence">Mark selection as evidence</button>
    </section>

    <section class="card">
        <h2>Current argument</h2>
        <div id="draft"></div>
        <button id="createArgument">Create argument from these spans</button>
    </section>

    <section>
        <h2>Arguments</h2>
        <div id="arguments"></div>
    </section>

    <section class="card">
        <h2>Link two arguments</h2>
        <div class="row">
            <select id="argumentA" aria-label="First argument"></select>
            <span>contradicts</span>
            <select id="argumentB" aria-label="Second argument"></select>
            <button id="addRelation">Add link</button>
        </div>
    </section>

    <section>
        <h2>Argument relations</h2>
        <div id="relations"></div>
    </section>

    <button id="download">Download annotations as JSON</button>

    <script>
        let documents = [{ id: 1, title: "Document 1", text: "", source: "" }];
        let activeDocumentId = 1;
        let draftSpans = [];
        let argumentsList = [];
        let relations = [];
        let nextDocumentId = 2;
        let nextArgumentId = 1;

        const $ = (id) => document.getElementById(id);
        const activeDocument = () =>
            documents.find((d) => d.id === activeDocumentId);
        const getArgument = (id) =>
            argumentsList.find((a) => a.id === Number(id));

        function optionLabel(argument) {
            const doc = documents.find((d) => d.id === argument.documentId);
            const claim = argument.claim.text;
            return `Argument ${argument.id} (${doc ? doc.title : "document"}): ${claim}`;
        }

        function parseDocument(fileContent) {
            // Split by "source:" to separate content from source URL
            const parts = fileContent.split(/^source:\s*/m);
            const text = parts[0].trim();
            const source = parts[1] ? parts[1].trim() : "";
            return { text, source };
        }

        function renderDocuments() {
            const picker = $("documentPicker");
            picker.replaceChildren();

            documents.forEach((doc) => {
                const option = document.createElement("option");
                option.value = doc.id;
                option.textContent = doc.title;
                picker.append(option);
            });

            picker.value = activeDocumentId;
            const doc = activeDocument();
            $("documentText").value = doc.text;

            const sourceUrlDiv = $("sourceUrl");
            if (doc.source) {
                sourceUrlDiv.textContent = `Source: ${doc.source}`;
                sourceUrlDiv.style.display = "block";
            } else {
                sourceUrlDiv.style.display = "none";
            }
        }

        function renderDraft() {
            const box = $("draft");
            box.replaceChildren();

            if (!draftSpans.length) {
                box.textContent = "No spans marked yet.";
                return;
            }

            draftSpans.forEach((span, index) => {
                const card = document.createElement("div");
                card.className = "card";

                const label = document.createElement("div");
                label.className = "label";
                label.textContent = span.kind;
                const quote = document.createElement("div");
                quote.className = "quote";
                quote.textContent = `"${span.text}"`;

                const remove = document.createElement("button");
                remove.textContent = "Remove span";
                remove.onclick = () => {
                    draftSpans.splice(index, 1);
                    renderDraft();
                };

                card.append(label, quote, remove);
                box.append(card);
            });
        }

        function renderArguments() {
            const box = $("arguments");
            box.replaceChildren();

            argumentsList.forEach((argument) => {
                const doc = documents.find((d) => d.id === argument.documentId);
                const card = document.createElement("div");
                card.className = "card";

                const title = document.createElement("div");
                title.className = "label";
                title.textContent = `Argument ${argument.id} · ${doc ? doc.title : "Unknown document"}`;

                const claimLabel = document.createElement("strong");
                claimLabel.textContent = "Claim";
                const claim = document.createElement("div");
                claim.className = "quote";
                claim.textContent = argument.claim.text;

                const evidenceLabel = document.createElement("strong");
                evidenceLabel.textContent = "Evidence";
                card.append(title, claimLabel, claim, evidenceLabel);

                argument.evidence.forEach((span) => {
                    const evidence = document.createElement("div");
                    evidence.className = "quote";
                    evidence.textContent = `• ${span.text}`;
                    card.append(evidence);
                });

                const remove = document.createElement("button");
                remove.textContent = "Delete argument";
                remove.onclick = () => {
                    argumentsList = argumentsList.filter(
                        (a) => a.id !== argument.id,
                    );
                    relations = relations.filter(
                        (r) => r.a !== argument.id && r.b !== argument.id,
                    );
                    renderAll();
                };

                card.append(remove);
                box.append(card);
            });

            ["argumentA", "argumentB"].forEach((id) => {
                const select = $(id);
                const previous = select.value;
                select.replaceChildren();

                argumentsList.forEach((argument) => {
                    const option = document.createElement("option");
                    option.value = argument.id;
                    option.textContent = optionLabel(argument);
                    select.append(option);
                });

                if (
                    [...select.options].some(
                        (option) => option.value === previous,
                    )
                ) {
                    select.value = previous;
                }
            });
        }

        function renderRelations() {
            const box = $("relations");
            box.replaceChildren();

            if (!relations.length) {
                box.textContent = "No relations added yet.";
                return;
            }

            relations.forEach((relation, index) => {
                const a = getArgument(relation.a);
                const b = getArgument(relation.b);
                if (!a || !b) return;

                const card = document.createElement("div");
                card.className = "card";
                card.textContent = `${optionLabel(a)}  contradicts  ${optionLabel(b)}`;

                const remove = document.createElement("button");
                remove.textContent = "Delete link";
                remove.onclick = () => {
                    relations.splice(index, 1);
                    renderRelations();
                };

                card.append(document.createElement("br"), remove);
                box.append(card);
            });
        }

        function renderAll() {
            renderDocuments();
            renderDraft();
            renderArguments();
            renderRelations();
        }

        function markSelection(kind) {
            const textArea = $("documentText");
            const start = textArea.selectionStart;
            const end = textArea.selectionEnd;

            if (start === end) {
                alert("Select a passage in the document first.");
                return;
            }

            if (
                kind === "claim" &&
                draftSpans.some((span) => span.kind === "claim")
            ) {
                alert(
                    "This argument already has a claim. Remove it first if you want to replace it.",
                );
                return;
            }

            draftSpans.push({
                kind,
                start,
                end,
                text: textArea.value.slice(start, end),
            });
            renderDraft();
        }

        $("directoryInput").onchange = async (event) => {
            const files = event.target.files;
            const txtFiles = Array.from(files).filter((file) =>
                file.name.endsWith(".txt"),
            );

            if (txtFiles.length === 0) {
                alert("No .txt files found in the selected directory.");
                return;
            }

            // Clear existing documents except the first one
            documents = [documents[0]];
            nextDocumentId = 2;
            draftSpans = [];
            argumentsList = [];
            relations = [];
            nextArgumentId = 1;

            // Load all .txt files
            for (const file of txtFiles) {
                const content = await file.text();
                const { text, source } = parseDocument(content);
                const title = file.name.replace(/\.txt$/, ""); // Remove .txt extension

                documents.push({
                    id: nextDocumentId++,
                    title: title,
                    text: text,
                    source: source,
                });
            }

            activeDocumentId = documents[1].id;
            renderAll();
            alert(`Loaded ${txtFiles.length} document(s).`);
        };

        $("documentPicker").onchange = (event) => {
            activeDocumentId = Number(event.target.value);
            draftSpans = [];
            renderAll();
        };

        $("documentText").oninput = (event) => {
            activeDocument().text = event.target.value;
        };

        $("addDocument").onclick = () => {
            const title = prompt(
                "Document title:",
                `Document ${nextDocumentId}`,
            );
            if (title === null) return;

            const doc = {
                id: nextDocumentId++,
                title: title.trim() || "Untitled document",
                text: "",
                source: "",
            };
            documents.push(doc);
            activeDocumentId = doc.id;
            draftSpans = [];
            renderAll();
        };

        $("markClaim").onclick = () => markSelection("claim");
        $("markEvidence").onclick = () => markSelection("evidence");

        $("createArgument").onclick = () => {
            const claim = draftSpans.find((span) => span.kind === "claim");
            const evidence = draftSpans.filter(
                (span) => span.kind === "evidence",
            );

            if (!claim || !evidence.length) {
                alert("Mark one claim and at least one evidence span first.");
                return;
            }

            argumentsList.push({
                id: nextArgumentId++,
                documentId: activeDocumentId,
                claim,
                evidence,
            });

            draftSpans = [];
            renderAll();
        };

        $("addRelation").onclick = () => {
            if (argumentsList.length < 2) {
                alert("Create at least two arguments first.");
                return;
            }

            const a = Number($("argumentA").value);
            const b = Number($("argumentB").value);

            if (a === b) {
                alert("Choose two different arguments.");
                return;
            }

            relations.push({ a, type: "contradicts", b });
            renderRelations();
        };

        $("download").onclick = () => {
            const data = JSON.stringify(
                { documents, arguments: argumentsList, relations },
                null,
                2,
            );
            const url = URL.createObjectURL(
                new Blob([data], { type: "application/json" }),
            );
            const link = Object.assign(document.createElement("a"), {
                href: url,
                download: "argument-annotations.json",
            });
            link.click();
            URL.revokeObjectURL(url);
        };

        renderAll();
    </script>
</html>
